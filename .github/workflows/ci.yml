name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend — PHP syntax validation ────────────────────────
  #
  # Esta plantilla contiene SOLO las capas de Clean Architecture
  # (Domain, Application, Infrastructure, Presentation).
  # El proyecto Laravel completo se crea con `laravel new backend`
  # al inicializar un proyecto nuevo (ver README → Paso 2).
  # Por eso el CI valida sintaxis PHP en lugar de ejecutar artisan.
  #
  backend:
    name: Backend — PHP Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --no-check-lock --no-check-publish

      - name: Check PHP syntax (Clean Architecture layers)
        run: find backend/app -name "*.php" | xargs php -l

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    name: Frontend — Type check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test -- --passWithNoTests

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost/api
        run: npm run build